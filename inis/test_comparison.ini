; test_comparison.ini — Shared configuration for output-parity testing.
;
; This INI drives both executor.py and (via ini_to_nf_params.py → YAML)
; the Nextflow pipeline against the same .test_data/ inputs so that
; compare_outputs.py can verify output equivalence.
;
; Usage:
;   1. Python:   python executor.py test_comparison.ini
;   2. Nextflow: python ini_to_nf_params.py test_comparison.ini -o params.yml
;                nextflow run main.nf -params-file params.yml \
;                    --outdir results_nf_comparison
;   3. Compare:  python compare_outputs.py \
;                   --dir-python  results_comparison/work \
;                   --dir-nextflow results_nf_comparison
;
; NOTE: Use a separate --outdir for Nextflow to avoid output collision
;       with executor.py results (which live under results_comparison/work/).

[systems]
systems     = ["Ung_G-C_4"]
variations  = {"Ung_G-C_4": ["wild"]}
num_replicates = 1
traj_format = dcd
top_format  = top
start_frame = 0

[paths]
input_dir  = .test_data
output_dir = results_comparison

[analysis]
run_rmsd    = true
run_rmsf    = true
run_2d_rmsd = false
run_rog     = true
run_hbonds  = false
run_plots   = false
time_unit   = ns

[selections]
target_selection = protein and backbone
ref_selection    = protein and backbone
rog_selection    = protein and backbone
wrap_selection   = auto

[rmsd]
time_interval_between_frames = 2.0

[rmsf]

[hbonds]

[plotting]
dpi = 150

[parallelization]
backend   = serial
n_workers = none

; ─────────────────────────────────────────────────────────────────────────────
; example_pipeline.ini — General-purpose template for executor.py
;
; Copy this file, rename it for your project, fill in the sections below,
; and run the pipeline from any directory:
;
;   python executor.py my_project.ini              # run all enabled analyses
;   python executor.py my_project.ini --dry-run    # preview without writing
;   python executor.py my_project.ini --force      # recompute even if cached
;   python executor.py my_project.ini --plot-only  # re-plot existing results
; ─────────────────────────────────────────────────────────────────────────────

; ── Systems ──────────────────────────────────────────────────────────────────
; systems    — JSON list of system base names (one entry per distinct system).
; variations — JSON dict mapping each system to a list of its variation labels.
;
; The pipeline resolves every combination of system + variation to a directory
; and a pair of files using this naming convention:
;
;   Input layout under input_dir (set in [paths]):
;     {system}/{variation}/{system}_system_{variation}.{top_format}
;     {system}/{variation}/{system}_production_{variation}_rep_{N}.{traj_format}
;
;   Example — for system "ProtA", variation "wild", replicate 1, dcd + top:
;     /path/to/data/ProtA/wild/ProtA_system_wild.top
;     /path/to/data/ProtA/wild/ProtA_production_wild_rep_1.dcd
;
; num_replicates — number of trajectory replicate files per system+variation.
;                  Default: 3  (rep_1 … rep_N)
; traj_format    — trajectory file extension without dot. Default: dcd
; top_format     — topology  file extension without dot. Default: top
; start_frame    — first frame index (0-based) to include in analyses.
;                  Default: 500  (skip equilibration; set 0 to use all frames)
;
[systems]
systems = ["SystemA", "SystemB"]
variations = {
    "SystemA": ["variation1", "variation2"],
    "SystemB": ["variation1", "variation2"]
    }
num_replicates = 3
traj_format    = xtc
top_format     = top
start_frame    = 0

; ── Paths ─────────────────────────────────────────────────────────────────────
; input_dir  — absolute path to the directory that contains the {system}/
;              sub-folders described above.  Can be anywhere on your storage.
; output_dir — where results (pickle files, work symlinks) are written.
;              Using ${input_dir}/results keeps everything self-contained
;              inside your data folder.  Change to any absolute path if needed.
; plot_dir   — where PNG plots are saved.
;              Defaults to ${output_dir}/plots when commented out.
;
[paths]
input_dir  = /absolute/path/to/your/data
output_dir = ${input_dir}/results
; plot_dir = ${output_dir}/plots

; ── Analysis toggles ──────────────────────────────────────────────────────────
; Set each flag to true or false to enable or disable the corresponding
; analysis module.  At least one analysis must be true.
;
; run_*  toggles — control whether each analysis is computed.
; plot_* toggles — control whether each analysis is plotted.
;   When plot_X is true but run_X is false, the pipeline expects pre-computed
;   pickle files in the work directory from a previous run.  If none are found,
;   the pipeline will exit with an informative error.
;
; run_plots — master switch for all plotting.  If false, no plots are generated
;   regardless of individual plot_* flags.
;
[analysis]
run_rmsd    = true
plot_rmsd   = true
run_rmsf    = true
plot_rmsf   = true
run_2d_rmsd = false
plot_2d_rmsd = false
run_rog     = true
plot_rog    = true
run_hbonds  = false
plot_hbonds = false
run_plots   = true

; time_unit  — global output time unit for all time-axis data and plots.
;   Accepted values: fs, ps, ns, us, ms, s.  Default: ns.
time_unit   = ns

; ── Selections ────────────────────────────────────────────────────────────────
; MDAnalysis atom-selection strings applied across all analyses.
;
; target_selection — atoms used to calculate RMSD / RMSF / 2D-RMSD values.
; ref_selection    — atoms used for structural alignment before RMSD analysis.
;   Can be a JSON list to iterate over multiple alignments and produce
;   separate RMSD pickle files / plots per alignment reference.
;   Example: ["protein and backbone", "name CA"]
;   A plain string (no JSON) is also accepted for backward compatibility,
;   and will be treated as a single-element list.
; rog_selection    — atoms included in the radius-of-gyration calculation.
;
; wrap_selection    — controls PBC (periodic boundary condition) wrapping.
;   'auto' (default) — unwrap/centre the protein and wrap everything else
;     back into the primary image.  Suitable for protein-only systems.
;   'none' — disable all wrapping transformations entirely.  Use this when
;     the trajectory is already unwrapped/imaged correctly.
;   Any other MDAnalysis selection string — atoms matching the selection are
;     wrapped into the primary image; everything else is unwrapped/centred.
;     For ligand-containing systems, exclude ligands from wrapping:
;       wrap_selection = not (protein or resname LIG)
;
; Use standard MDAnalysis selection syntax:
;   "protein and backbone"      — Cα/N/C/O backbone of all protein residues
;   "protein and name CA"       — alpha-carbons only
;   "resid 1:100 and backbone"  — backbone of residues 1–100
;   "segid A and backbone"      — backbone of segment/chain A
;   "nucleic"                   — all nucleic-acid atoms
;
[selections]
target_selection = protein and backbone
ref_selection    = ["protein and backbone"]
rog_selection    = protein and backbone
wrap_selection   = auto

; ── RMSD settings ──────────────────────────────────────────────────────────────
; time_interval_between_frames — time step between saved frames in ps.
;   REQUIRED when run_rmsd = true.
;   Used to build the time axis. This value CANNOT be inferred from
;   trajectory files and must always be provided explicitly.
;   The pipeline validates it as a positive sanity-checked value and, for DCD
;   trajectories, derives a `time_length` metadata field automatically.
;   Set to 'none' ONLY when run_rmsd = false.
;
; group_selections — additional MDAnalysis selection strings to compute RMSD for.
;   Each entry produces an independent RMSD calculation and separate pickle/plot.
;   target_selection is always included first as the canonical RMSD output.
;   group_selections are appended after target_selection.
;   Duplicate selections are automatically removed (first occurrence kept).
;   Use a JSON list of strings, e.g.:
;     ["protein and backbone", "nucleic", "resid 50:60 and name CA"]
;   If a selection does not exist in a system, a warning is printed and that
;   selection is skipped (the run does not crash).
;   Set to 'none' to compute only the main target_selection.
;
[rmsd]
time_interval_between_frames = 2.0 # in ps; REQUIRED when DCD files, else set to 'none'
group_selections = none

; ── RMSF settings ──────────────────────────────────────────────────────────────
; chain_intervals — residue ranges (1-based, PDB-style) to split the RMSF
;   profile into labelled chain segments on the plot.
;
;   Two formats are accepted:
;
;   Per-system (recommended when chains differ between systems):
;     chain_intervals = {
;         "SystemA": {"A": [1, 200], "B": [201, 400]},
;         "SystemB": {"A": [1, 180]}
;         }
;
;   Legacy flat (same ranges broadcast to every system):
;     chain_intervals = {"A": [1, 200], "B": [201, 400]}
;
;   Set to 'none' to compute RMSF for the whole target_selection as one segment.
;
; group_selections — additional MDAnalysis selection strings to compute RMSF for.
;   Each entry produces an independent RMSF calculation and separate pickle/plot.
;   Like [rmsd] group_selections, RMSF pickles with group_selections are named
;   with _sel{N} suffixes and are automatically detected and plotted when plot_groups
;   are configured.
;   Use a JSON list of strings, e.g.:
;     ["chainid A", "chainid B", "chainid C"]
;   Set to 'none' to compute only the main target_selection.
;
; NOTE: RMSF now iterates all ref_selection entries (like RMSD does), producing
;   separate pickles for each ref_selection when multiple are specified in [selections].
;   This enables alignment flexibility and is useful for structure validation.
;   In plot_groups with replicate_mode=average, replicates with differing residue
;   counts will trigger a warning and be truncated to the shortest common length
;   before averaging to prevent data loss from silent failures.
;
[rmsf]
chain_intervals = none
; chain_intervals: Per-residue RMSF split by chain (optional).
;   Supports two formats:
;   1. Per-system: {"systemA": {"A": [1, 100], "B": [101, 200]}, "systemB": ...}
;   2. Legacy flat: {"A": [1, 100], "B": [101, 200]} (applied to all systems)
;   Example (per-system):
;     chain_intervals = {"systemA": {"A": [1, 81], "B": [82, 200], "C": [201, 320]}, "systemB": {"A": [1, 75]}}
;   Note: Residue numbers are 1-based (PDB-style), inclusive ranges.

chain_mapping = none
; chain_mapping — REORDER TRAJECTORY ATOMS when reference PDB does not match trajectory.
;
; USE CASE:
;   Your reference PDB has chain IDs A, B, C but your trajectory has chainids
;   PROA, PROB, PROC. Or, atoms are ordered differently between PDB and trajectory.
;   Without remapping, selections like 'chainid A' fail or match wrong atoms.
;
; SYMPTOM OF NEEDING chain_mapping:
;   - Selection 'chainid A' matched 0 atoms (when it should match)
;   - Chain-based RMSD/RMSF calculations are silently incorrect
;   - Residue numbering in output doesn't match your PDB expectations
;
; HOW IT WORKS:
;   1. Maps PDB chain ID (left) to trajectory chain ID (right)
;   2. Reorders trajectory atoms to match PDB atom order within each chain
;   3. Atoms are matched by position (handles different resid numbering)
;   4. Unmapped chains (solvent, ions) automatically appended at the end
;   5. Reordered trajectory used transparently for all subsequent analyses (RMSD, RMSF, 2D-RMSD)
;
; FORMAT — Two options:
;   1. Per-system (recommended): specify mapping for each system separately
;      chain_mapping = {
;          "sub1_P": {"A": "PROA", "B": "PROB", "C": "PROC"},
;          "other_sys": {"A": "CHAINA"}
;          }
;
;   2. Legacy flat (broadcast to all systems):
;      chain_mapping = {"A": "PROA", "B": "PROB", "C": "PROC"}
;
; EXAMPLE (nucleolin sub1_P):
;   # PDB: chainids A, B, C (local numbering 1-100 each)
;   # Trajectory: chainids PROA, PROB, PROC (same order, same atom count per chain)
;   chain_mapping = {"sub1_P": {"A": "PROA", "B": "PROB", "C": "PROC"}}
;
; DIAGNOSTIC STEP (check your PDB vs trajectory):
;   python -c "
;     import MDAnalysis as mda
;     pdb = mda.Universe('sub1_P_system_production.pdb')
;     traj = mda.Universe('sub1_P_system_production.top', 'sub1_P_production_production_rep_1.dcd')
;     print('PDB chains:', set(str(c).strip() for c in pdb.atoms.chainIDs))
;     print('Trajectory chains:', set(str(c).strip() for c in traj.atoms.chainIDs))
;   "
;
; APPLIES TO ALL ANALYSES:
;   When configured, chain_mapping reorders the trajectory BEFORE wrapping and
;   all analyses (RMSD, RMSF, 2D-RMSD), ensuring atom ordering is consistent.

group_selections = none
; group_selections: Optional custom selections for RMSF reporting (beyond chain split).
;   JSON list of MDAnalysis selection strings.
;   Example: group_selections = ["chainid A and backbone", "resname ALA and backbone"]


; ── 2D-RMSD settings ─────────────────────────────────────────────────────────
; This analysis currently uses selection controls from [selections].
; There are no dedicated per-analysis numeric knobs here.
; Keep this note to document intent and avoid hidden defaults.

; ── RoG settings ─────────────────────────────────────────────────────────────
; This analysis currently uses rog_selection from [selections] and time_unit
; from [analysis]. There are no extra numeric knobs here.

; ── H-bonds settings ───────────────────────────────────────────────────────────
; Choose ONE of the two modes below and set the other fields to 'none'.
;
; Mode 1 — atom-focused: explicitly provide donor/acceptor atom selections.
;   acceptors_sel — MDAnalysis selection for acceptor heavy atoms.
;   hydrogens_sel — MDAnalysis selection for hydrogen atoms on donors.
;   Example:
;     acceptors_sel = protein and name O OD1 OD2 OE1 OE2 ND1 NE2 OH
;     hydrogens_sel = protein and name H HN HE HD
;
; Mode 2 — pair-focused: list pairs of groups to detect H-bonds between.
;   between_pairs — JSON list of [selection_1, selection_2] pairs.
;   Example: between_pairs = [["protein", "nucleic"], ["protein", "resname LIG"]]
;
; d_a_cutoff          — max donor–acceptor distance in Å.    Default: 3.5
; d_h_a_angle_cutoff  — min D–H···A angle in degrees.        Default: 150.0
; update_selections   — recompute atom selections each frame. Default: true
;   (set false only for rigid, non-changing selections to speed up analysis)
;
; hbonds_preset — convenience preset for common biological scenarios.
;   Accepted values:
;   custom           — do not inject defaults; use explicit selections only.
;     protein_protein  — pair-focused protein↔protein contacts.
;     protein_nucleic  — pair-focused protein↔nucleic contacts (DNA/RNA).
;     protein_ligand  — pair-focused protein↔ligand ligand-like contacts,
;                        excluding common solvent/ions by default.
;   Plot titles use the resolved preset name, not the raw atom-selection text.
;
; Precedence rules:
;   1) Preset seeds default acceptors_sel/hydrogens_sel/between_pairs.
;   2) Explicit INI values (acceptors_sel/hydrogens_sel/between_pairs) override
;      preset defaults when provided.
;   3) custom keeps everything as provided (no implicit defaults).
;
; Practical examples:
;   hbonds_preset = protein_nucleic
;   hbonds_preset = protein_protein
;   hbonds_preset = custom
;   between_pairs = [["protein", "resname LIG"]]
;
; Scientific caveats:
;   - If topology lacks donor-hydrogen bond information, pipeline may attempt
;     bond guessing and then a permissive distance-based fallback.
;   - Distance-based fallback is robust but can over-count weak/non-specific
;     contacts. Prefer explicit atom selections for publication-grade analysis.
;   - For protein_ligand, ensure ligand resnames/atom naming follow your FF
;     conventions; tune between_pairs and atom selections when needed.
;
[hbonds]
d_a_cutoff         = 3.5
d_h_a_angle_cutoff = 150.0
update_selections  = true
hbonds_preset      = custom
acceptors_sel      = none
hydrogens_sel      = none
between_pairs      = none

; ── Parallelization ──────────────────────────────────────────────────────────
; MDAnalysis 2.8+ native parallel backends for split-apply-combine analyses.
;
; backend   — parallel backend to use.  Options:
;   'serial'           — single-process execution (default, safest)
;   'multiprocessing'  — stdlib multiprocessing (no extra dependencies)
;   'dask'             — Dask distributed (requires:  pip install dask[distributed])
;
; n_workers — number of parallel workers.  Options:
;   'none' / 'auto' — auto-detect (min(cpu_count, 4)) — recommended default
;   an integer      — explicit worker count
;
; Which analyses benefit:
;   RMSD          — supports multiprocessing and dask
;   H-bonds       — supports multiprocessing and dask
;   RMSF          — always serial (split-apply-combine not supported)
;   2D-RMSD       — always serial (O(N²) pairwise, not parallelisable)
;   RoG           — always serial (manual per-frame loop)
;
; Safety: if trajectory transformations (PBC wrapping) are not compatible
; with the chosen parallel backend, execution automatically falls back to
; serial with a warning.
;
[parallelization]
backend   = serial
n_workers = none

; ── Plotting ─────────────────────────────────────────────────────────────────
; dpi              — output image resolution in dots per inch.  Default: 400
; rmsd_show_kde    — overlay a KDE density curve on RMSD distribution plots.
; rog_show_kde     — overlay a KDE density curve on RoG distribution plots.
; rmsf_plot_type   — 'line' for a continuous profile or 'bar' for a bar chart.
; twod_rmsd_cmap   — Matplotlib colormap for the 2D-RMSD matrix heatmap.
;                    Examples: viridis, plasma, RdBu, coolwarm
; hbonds_top_n     — number of most-frequent H-bond pairs to display.
;
[plotting]
dpi              = 150
rmsd_show_kde    = true
rog_show_kde     = true
rmsf_plot_type   = line
twod_rmsd_cmap   = viridis
hbonds_top_n     = 20
[plot_groups]
   replicate_mode = average
   wild_vs_mutant = [["SystemA", "wild"], ["SystemA", "k84r"]]
   cross_system   = [["SystemA", "wild"], ["SystemB", "wild"]]
; ── Plot Groups ──────────────────────────────────────────────────────────────
; Named comparison groups for overlay plots.
; Each line defines a group: group_name = JSON list of [system, variation] pairs.
; All members of a group are overlaid on the same comparison plot.
; Individual (one-per-pickle) plots are always produced in addition.
;
; replicate_mode — how to handle multiple replicates in comparison plots:
;   'separate' = one comparison plot per replicate (default)
;   'average'  = mean ± std across replicates, one averaged plot per group
;
; Example:
;   [plot_groups]
;   replicate_mode = separate
;   wild_vs_mutant = [["SystemA", "wild"], ["SystemA", "k84r"]]
;   cross_system   = [["SystemA", "wild"], ["SystemB", "wild"]]
;
; Uncomment and edit below to enable:
; [plot_groups]
; replicate_mode = separate

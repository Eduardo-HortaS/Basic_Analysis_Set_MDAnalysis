; test_plot_groups.ini — Manual parity smoke test for plot_groups.
;
; This config targets the bundled .test_data dataset and enables grouped
; comparison plotting for RMSD and RMSF so behavior can be validated across
; executor.py and Nextflow.

[systems]
systems     = ["Ung_G-C_4"]
variations  = {"Ung_G-C_4": ["wild"]}
num_replicates = 1
traj_format = dcd
top_format  = top
start_frame = 0

[paths]
input_dir  = .test_data
output_dir = results_plot_groups_py

[analysis]
run_rmsd    = true
plot_rmsd   = true
run_rmsf    = true
plot_rmsf   = true
run_2d_rmsd = false
plot_2d_rmsd = false
run_rog     = false
plot_rog    = false
run_hbonds  = false
plot_hbonds = false
run_plots   = true
time_unit   = ns

[selections]
target_selection = protein and backbone
ref_selection    = protein and backbone
rog_selection    = protein and backbone
wrap_selection   = auto

[rmsd]
time_interval_between_frames = 2.0

[rmsf]

[hbonds]

[plotting]
dpi = 150
rmsd_show_kde = true
rmsf_plot_type = line

[parallelization]
backend   = serial
n_workers = none

[plot_groups]
replicate_mode = separate
self_compare = [["Ung_G-C_4", "wild"]]
